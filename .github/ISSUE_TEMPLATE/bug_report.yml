name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
  - type: input
    id: version
    attributes:
      label: App version
